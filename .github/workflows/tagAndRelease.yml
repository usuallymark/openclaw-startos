name: Tag and Release

on:
  push:
    branches: ['master']
    paths-ignore: ['*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP "version:\s*['\"\`]\K[^'\"\`]*" startos/versions/current.ts | head -1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION//:/.}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install start-cli
        run: |
          curl -fsSL "https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2Fv1.1.0/start-cli_x86_64-linux" \
            -o /usr/local/bin/start-cli
          chmod +x /usr/local/bin/start-cli
          start-cli --version

      - name: Initialize packaging workspace
        run: |
          cd ..
          start-cli s9pk init-workspace
          echo "=== Workspace files created ==="
          find . -maxdepth 2 -name "*.yaml" -o -name "*.yml" -o -name "*.toml" -o -name "*.json" 2>/dev/null | grep -v node_modules | grep -v ".git"
          echo "=== Startos config ==="
          find ~/.startos -type f 2>/dev/null | xargs ls -la 2>/dev/null || echo "no ~/.startos files"
          cat ~/.startos/config.yaml 2>/dev/null || echo "no config.yaml"
          echo "=== Parent dir files ==="
          ls -la .

      - name: Build s9pk
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: make

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          files: '*.s9pk'
          generate_release_notes: false
